name: 'Build and Test'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
        
    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Check API build
        working-directory: api
        run: npm run build

      - name: Run API temporal tests
        working-directory: api
        env:
          DB_PATH: ${{ runner.temp }}/hammer-overlay-api-ci.db
        run: npm test

      - name: Run live temporal smoke tests if configured
        working-directory: api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.5
          OPENAI_REASONING_EFFORT: low
          LANGFUSE_ENABLED: 'false'
        run: npm run test:temporal:live

      - name: Run temporal model evals if configured
        working-directory: api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_ENABLED: 'false'
          TEMPORAL_EVAL_MODELS: ${{ vars.TEMPORAL_EVAL_MODELS }}
          TEMPORAL_EVAL_REQUIRE_OPENAI: ${{ vars.TEMPORAL_EVAL_REQUIRE_OPENAI }}
        run: npm run eval:temporal

      - name: Run frontend tests
        run: npm test -- --run --reporter=verbose
        continue-on-error: true

      - name: Check frontend build
        run: npm run build

      - name: Prepare API sidecar resources
        run: npm run prepare:api-sidecar

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Run Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
        continue-on-error: true

      - name: Build Tauri application (Debug)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run tauri build -- --debug --config src-tauri/tauri.ci.conf.json

      - name: Verify build artifacts
        shell: bash
        run: |
          echo "🔍 Checking build artifacts..."
          
          # Check if MSI was created
          if find src-tauri/target/debug/bundle/msi/ -name "*.msi" -print -quit | grep -q .; then
            echo "✅ MSI installer created successfully"
            MSI_PATH=$(find src-tauri/target/debug/bundle/msi/ -name "*.msi" | head -1)
            MSI_SIZE=$(stat -f%z "$MSI_PATH" 2>/dev/null || stat -c%s "$MSI_PATH" 2>/dev/null || echo "unknown")
            echo "📦 MSI file: $(basename "$MSI_PATH") ($MSI_SIZE bytes)"
          else
            echo "❌ No MSI installer found"
            exit 1
          fi
          
          # Check if executable was created
          if find src-tauri/target/debug/ -name "*.exe" -print -quit | grep -q .; then
            echo "✅ Executable created successfully"
          else
            echo "❌ No executable found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts-${{ matrix.platform }}
          path: |
            src-tauri/target/debug/bundle/msi/*.msi
            src-tauri/target/debug/*.exe
          retention-days: 7

      - name: Print build summary
        shell: bash
        run: |
          echo "🎉 Build test completed!"
          echo "🏠 Repository: BASIC-BIT/discord-time-app"
          echo "🔧 Platform: ${{ matrix.platform }}"
          echo "📝 This was a development build for testing purposes"
          echo ""
          echo "✅ Build artifacts are available in the Actions artifacts"

  linux-desktop:
    runs-on: ubuntu-24.04
    container:
      image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/linux-desktop/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.cache/linux-desktop/rustup
      npm_config_cache: ${{ github.workspace }}/.cache/linux-desktop/npm
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      LANGFUSE_ENABLED: 'false'
      TEMPORAL_FEATURE_PLAN_IR: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Node.js and expose Cargo tools
        run: |
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Trust checked-out repository in job container
        run: |
          # Checkout's temporary Git configuration does not cover later shells.
          # Trust only this known checkout in the ephemeral job container.
          git config --global --add safe.directory "$PWD"
          git rev-parse --verify HEAD

      - name: Cache desktop dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            .cache/linux-desktop
            src-tauri/target
          key: linux-desktop-bookworm-14078204-rust-1.99.1-${{ hashFiles('scripts/setup-linux-desktop.sh', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock', 'package-lock.json', 'api/package-lock.json') }}

      - name: Install and check Linux desktop prerequisites
        run: |
          bash scripts/setup-linux-desktop.sh --install
          bash scripts/setup-linux-desktop.sh --check

      - name: Install frontend and API dependencies
        run: |
          npm ci
          npm --prefix api ci

      - name: Run offline routing, picker and API tests
        env:
          DB_PATH: ${{ runner.temp }}/hammer-overlay-linux-tests/usage.db
        run: |
          install -d -m 700 "$(dirname "$DB_PATH")"
          npm test

      - name: Run desktop runner boundary tests with installed proxy
        run: |
          command -v tauri-driver
          python3 -m unittest discover -s scripts -p 'test_desktop_smoke.py' -v

      - name: Run full native desktop suite
        run: npm run test:desktop -- --suite all

      - name: Upload Linux desktop evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-desktop-evidence
          path: artifacts/desktop/
          retention-days: 7
