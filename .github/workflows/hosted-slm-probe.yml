name: Diagnose bare Easter on RunPod
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --prefix api
      - name: Capture the RunPod plan and validation for bare Easter
        working-directory: api
        env:
          HOSTED_SLM_API_KEY: ${{ secrets.HOSTED_SLM_API_KEY }}
          HOSTED_SLM_BASE_URL: ${{ vars.HOSTED_SLM_BASE_URL }}
        run: node --import tsx scripts/easter-provider-diagnostic.ts
