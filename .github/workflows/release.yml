name: Private standalone clock diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - name: Capture the synthetic failure and raw Plan-IR
        env:
          TEMPORAL_EVAL_BASELINES: endpoint-plan
          TEMPORAL_EVAL_CASE_IDS: diagnostic-standalone-5pm-installed-runpod
          TEMPORAL_EVAL_DEBUG_CASE: diagnostic-standalone-5pm-installed-runpod
          TEMPORAL_EVAL_ENDPOINT_BASE_URL: https://lvddpcgo2rizu8.api.runpod.ai/v1
          TEMPORAL_EVAL_ENDPOINT_API_KEY: ${{ secrets.HOSTED_SLM_API_KEY }}
          TEMPORAL_EVAL_ENDPOINT_MODEL: qwen-temporal-ir-qwen35-08b-bf16-chat-range-format-infix-v22
          TEMPORAL_EVAL_ENDPOINT_API: chat
          TEMPORAL_EVAL_ENDPOINT_PROMPT_FORMAT: chat
          TEMPORAL_EVAL_ENDPOINT_INSTRUCTION_PRESET: minimal
          TEMPORAL_EVAL_ENDPOINT_MAX_TOKENS: '512'
          TEMPORAL_EVAL_ENDPOINT_TIMEOUT_MS: '180000'
          TEMPORAL_EVAL_OUTPUT: ../5pm-hosted-diagnostic.json
        shell: pwsh
        run: |
          npm --prefix api run eval:temporal 2>&1 | Tee-Object -FilePath 5pm-trace.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-5pm-diagnostic
          retention-days: 7
          path: |
            5pm-hosted-diagnostic.json
            5pm-trace.log
