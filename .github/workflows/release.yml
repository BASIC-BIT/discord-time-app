name: Installed 0.1.9 draft smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Draft release tag to install
        required: true

jobs:
  installed-smoke:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRAFT_VERSION: ${{ inputs.version }}
    steps:
      - name: Install and verify the exact draft MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DRAFT_VERSION -cne 'v0.1.9') { throw 'Expected the v0.1.9 draft.' }
          $releaseJson = gh release view $env:DRAFT_VERSION --json isDraft,assets,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the draft.' }
          $release = $releaseJson | ConvertFrom-Json
          if (!$release.isDraft -or $release.targetCommitish -cne '6d6a3b030a1e0a5259aa49042b174d09336b3da5') {
            throw 'Expected a draft built from the merged release commit.'
          }
          $dir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'hammeroverlay-v0.1.9')
          gh release download $env:DRAFT_VERSION --dir $dir.FullName --pattern '*.msi' --pattern '*.msi.sig' --pattern 'latest.json'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download draft assets.' }
          Remove-Item Env:GH_TOKEN
          $msi = @(Get-ChildItem -LiteralPath $dir.FullName -Filter '*.msi')
          if ($msi.Count -ne 1) { throw 'Expected exactly one MSI.' }
          $msi = $msi[0]
          $manifest = Get-Content -LiteralPath (Join-Path $dir.FullName 'latest.json') -Raw | ConvertFrom-Json
          $entry = $manifest.platforms.'windows-x86_64'
          $signature = (Get-Content -LiteralPath "$($msi.FullName).sig" -Raw).Trim()
          $expectedUrl = "https://github.com/$env:GH_REPO/releases/download/$env:DRAFT_VERSION/$($msi.Name)"
          if ($manifest.version -cne '0.1.9' -or $entry.url -cne $expectedUrl -or !$signature -or $entry.signature -cne $signature) {
            throw 'Draft manifest and MSI signature attachment disagree.'
          }
          $digest = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installed test input SHA-256: $digest"
          $log = Join-Path $dir.FullName 'msi-install.log'
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /log `"$log`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI exited with $($install.ExitCode)." }
          $exe = Get-Item -LiteralPath (Join-Path $env:ProgramFiles 'HammerOverlay/hammer-overlay.exe')
          if ($exe.VersionInfo.ProductVersion -cne '0.1.9') { throw 'Installed executable version mismatch.' }
          $app = Start-Process -FilePath $exe.FullName -PassThru
          $health = $null
          for ($i = 0; $i -lt 45; $i++) {
            if ($app.HasExited) { throw 'Installed app exited during startup.' }
            try {
              $health = Invoke-RestMethod 'http://127.0.0.1:8857/health' -TimeoutSec 2
              if ($health.status -eq 'healthy') { break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if ($health.status -ne 'healthy' -or $health.appVersion -cne '0.1.9') { throw 'Installed parser did not report healthy on 0.1.9.' }
          $listener = Get-NetTCPConnection -LocalPort 8857 -State Listen | Select-Object -First 1
          $parser = Get-CimInstance Win32_Process -Filter "ProcessId=$($listener.OwningProcess)"
          if (!$parser.ExecutablePath -or !$parser.ExecutablePath.StartsWith($exe.DirectoryName + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'The healthy parser did not originate from the installed package.'
          }
          @(
            'Exact 0.1.9 draft MSI install and startup passed.'
            "MSI: $($msi.Name)"
            "SHA-256: $digest"
            "App and healthy installed parser version: $($health.appVersion)"
          ) | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
